name: 抓取校园通知并更新数据快照

# 说明：
#   GitHub Actions 的 schedule 是最省事的「免费定时抓取器」——
#   无需自备服务器，抓取结果提交回仓库，Cloudflare Pages 检测到推送即自动重新部署。
#
#   注意：GitHub 的定时任务在仓库长期无活动时会被自动停用（约 60 天），
#   且高峰期可能延迟几分钟到几十分钟，对通知汇总场景完全够用。
#   另外 schedule 只在默认分支上生效。

on:
  schedule:
    # 每天 6 次：早 7 点至晚 10 点之间每 3 小时一次（UTC 时间，对应北京时间 -8 小时）
    # 北京时间 07:00 / 10:00 / 13:00 / 16:00 / 19:00 / 22:00
    - cron: '0 23,2,5,8,11,14 * * *'
  workflow_dispatch: # 支持在 Actions 页面手动触发

# 允许把抓取结果提交回仓库
permissions:
  contents: write

# 避免两次抓取重叠
concurrency:
  group: fetch-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 数据库需要跨次运行保留，否则每次都从零开始、无法增量去重。
      # 这里用 Actions 缓存保存 SQLite 文件。
      - name: 恢复历史数据库
        uses: actions/cache/restore@v4
        with:
          path: data/better-news.db
          key: bn-db-${{ github.run_id }}
          restore-keys: |
            bn-db-

      - name: 自动发现学院栏目（首次或栏目失效时执行）
        run: |
          if [ ! -f config/discovered.json ]; then
            echo "未找到 discovered.json，执行栏目发现…"
            npm run discover
          else
            echo "已存在 discovered.json，跳过（如需重新发现请手动运行 npm run discover）"
          fi
        continue-on-error: true

      - name: 抓取通知（校级 + 学院）
        run: npm run fetch:all

      - name: 导出静态数据快照
        run: npm run export

      - name: 自检数据质量
        run: npm run selftest
        continue-on-error: true

      - name: 保存数据库缓存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/better-news.db
          key: bn-db-${{ github.run_id }}

      - name: 提交更新的快照
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data config/discovered.json
          if git diff --staged --quiet; then
            echo "数据无变化，无需提交"
          else
            COUNT=$(node -e "console.log(require('./public/data/index.json').total)")
            git commit -m "chore(data): 更新通知快照（共 ${COUNT} 条）[skip ci]"
            git push
            echo "已提交并推送，Cloudflare Pages 将自动重新部署"
          fi
