name: 构建 Android APK

# 为什么在云端构建：本机只有 Java 8，且没有 Android SDK 与 Gradle，
# 而 Capacitor 7 需要 Java 17 + Android SDK 34。
# GitHub Actions 的 ubuntu 镜像自带这些工具，零成本且构建可复现。
#
# 触发方式：
#   · 手动（Actions 页面 Run workflow）
#   · 推送 v* 标签时自动构建并发布到 Releases
#
# 产物：app-release.apk（已签名，可直接安装）

on:
  workflow_dispatch:
    inputs:
      release:
        description: '是否创建 GitHub Release'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装根目录依赖（解析/信源模块）
        run: npm ci

      - name: 安装 App 依赖
        working-directory: app
        run: npm ci

      - name: 生成签名密钥
        working-directory: app/android
        run: |
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/release.keystore \
            -alias betternews \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass betternews -keypass betternews \
            -dname "CN=BetterNews, OU=Student, O=NUC, L=Taiyuan, ST=Shanxi, C=CN"
          echo "✓ 已生成签名密钥（有效期 30 年）"

      - name: 构建前端资源（含 49 个信源）
        working-directory: app
        run: npm run build

      - name: 同步到 Android 工程
        working-directory: app
        run: npx cap sync android

      - name: 构建 APK
        working-directory: app/android
        env:
          KEYSTORE_PASSWORD: betternews
          KEY_ALIAS: betternews
          KEY_PASSWORD: betternews
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 检查产物
        working-directory: app/android
        run: |
          ls -la app/build/outputs/apk/release/
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "APK_SIZE=$(du -h "$APK" | cut -f1)" >> "$GITHUB_ENV"

      - name: 上传 APK 为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: better-news-apk
          path: app/android/app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: 发布到 Releases
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="v1.0.0"
          fi

          # 说明文本用 shell 变量拼接。
          # 注意：不能把多行文本直接写在 run: 块里的 YAML 标量中——
          # 中文全角冒号「：」会被 YAML 当作映射键的分隔符，导致整个工作流解析失败
          # （表现为 Actions 里「没有 job、没有日志」的假死状态）。
          NOTES=$(cat <<'EOF'
          ## 中北大学通知 App

          **安装方式**：下载 APK 到手机，点击安装（首次需在系统设置中允许「安装未知来源应用」）。

          **特性**
          - App 自带抓取：直连 49 个校内外信源，不需要服务器，也不需要电脑开机
          - 按栏目汇总：党务工作 / 学生工作 / 教务选课 / 研究生 / 团学活动 / 学校主页 / 学院通知
          - 计算机科学与技术学院置顶
          - 截止时间自动识别、关键词标签、已读收藏

          **技术说明**：学校站点不返回 CORS 头，浏览器无法直接抓取，
          因此 App 通过原生网络栈发起请求（CapacitorHttp），绕开浏览器同源策略。
          EOF
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH" --clobber
            echo "已追加到已有 Release $TAG"
          else
            gh release create "$TAG" "$APK_PATH" \
              --title "中北通知 $TAG" \
              --notes "$NOTES" \
              --target "${{ github.sha }}"
            echo "已创建 Release $TAG"
          fi
