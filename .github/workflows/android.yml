name: 构建 Android APK

# 为什么在云端构建：本机只有 Java 8，且没有 Android SDK 与 Gradle，
# 而 Capacitor 7 需要 Java 17 + Android SDK 34。
# GitHub Actions 的 ubuntu 镜像自带这些工具，零成本且构建可复现。
#
# 触发方式：
#   · 手动（Actions 页面 Run workflow）
#   · 推送 v* 标签时自动构建并发布到 Releases
#
# 产物：app-release.apk（已签名，可直接安装）

on:
  workflow_dispatch:
    inputs:
      release:
        description: '是否创建 GitHub Release'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      # Capacitor 7 的 Android 模块按 Java 21 编译（sourceCompatibility 21），
      # 用 Java 17 会报 "invalid source release: 21"。
      - name: 安装 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 不用 android-actions/setup-android：该 action 会执行 `sdkmanager tools`，
      # 而 `tools` 包已被 Google 从 SDK 仓库移除，导致 “Failed to find package 'tools'” 直接失败。
      # GitHub 的 ubuntu runner 本就预装了 Android SDK，直接指过去即可。
      - name: 配置 Android SDK（使用 runner 预装版本）
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          ls "$SDK" || true

      - name: 安装所需的 SDK 组件
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools" \
            > /dev/null
          echo "✓ SDK 组件已安装"

      - name: 安装根目录依赖（解析/信源模块）
        run: npm ci

      - name: 安装 App 依赖
        working-directory: app
        run: npm ci

      - name: 生成签名密钥
        working-directory: app/android
        run: |
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/release.keystore \
            -alias betternews \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass betternews -keypass betternews \
            -dname "CN=BetterNews, OU=Student, O=NUC, L=Taiyuan, ST=Shanxi, C=CN"
          echo "✓ 已生成签名密钥（有效期 30 年）"

      - name: 构建前端资源（含 49 个信源）
        working-directory: app
        run: npm run build

      - name: 同步到 Android 工程
        working-directory: app
        run: npx cap sync android

      - name: 构建 APK
        working-directory: app/android
        env:
          KEYSTORE_PASSWORD: betternews
          KEY_ALIAS: betternews
          KEY_PASSWORD: betternews
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 检查产物
        working-directory: app/android
        run: |
          ls -la app/build/outputs/apk/release/
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::未找到 APK 产物"
            exit 1
          fi
          case "$APK" in
            *unsigned*) echo "::error::产物是未签名的 APK（$APK），无法安装"; exit 1 ;;
          esac
          # 记录仓库根目录下的绝对路径，供后续步骤使用（各步骤工作目录不同）
          echo "APK_ABS=$(realpath "$APK")" >> "$GITHUB_ENV"
          echo "✓ 产物: $APK ($(du -h "$APK" | cut -f1))"

      # 校验签名：Gradle 在签名配置缺失时会安静地产出未签名包，
      # 装到手机上才失败。这一步把它挡在构建阶段。
      - name: 校验 APK 签名
        run: |
          node scripts/verify-apk.mjs "$APK_ABS"
          echo "✓ 签名校验通过"

      - name: 上传 APK 为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: better-news-apk
          path: app/android/app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: 发布到 Releases
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="v1.0.0"
          fi

          # 说明文本用 shell 变量拼接。
          # 注意：不能把多行文本直接写在 run: 块里的 YAML 标量中——
          # 中文全角冒号「：」会被 YAML 当作映射键的分隔符，导致整个工作流解析失败
          # （表现为 Actions 里「没有 job、没有日志」的假死状态）。
          NOTES=$(cat <<'EOF'
          ## 中北大学通知 App

          **安装方式**：下载 APK 到手机，点击安装（首次需在系统设置中允许「安装未知来源应用」）。

          **特性**
          - App 自带抓取：直连 49 个校内外信源，不需要服务器，也不需要电脑开机
          - 按栏目汇总：党务工作 / 学生工作 / 教务选课 / 研究生 / 团学活动 / 学校主页 / 学院通知
          - 计算机科学与技术学院置顶
          - 截止时间自动识别、关键词标签、已读收藏

          **技术说明**：学校站点不返回 CORS 头，浏览器无法直接抓取，
          因此 App 通过原生网络栈发起请求（CapacitorHttp），绕开浏览器同源策略。
          EOF
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_ABS" --clobber
            echo "已追加到已有 Release $TAG"
          else
            gh release create "$TAG" "$APK_ABS" \
              --title "中北通知 $TAG" \
              --notes "$NOTES" \
              --target "${{ github.sha }}"
            echo "已创建 Release $TAG"
          fi
