name: 抓取校园通知并更新数据快照

# 说明：
#   GitHub Actions 的 schedule 是最省事的「免费定时抓取器」——
#   无需自备服务器，抓取结果提交回仓库，Cloudflare Pages 检测到推送即自动重新部署。
#
#   注意：GitHub 的定时任务在仓库长期无活动时会被自动停用（约 60 天），
#   且高峰期可能延迟几分钟到几十分钟，对通知汇总场景完全够用。
#   另外 schedule 只在默认分支上生效。

on:
  schedule:
    # 每天 6 次：早 7 点至晚 10 点之间每 3 小时一次（UTC 时间，对应北京时间 -8 小时）
    # 北京时间 07:00 / 10:00 / 13:00 / 16:00 / 19:00 / 22:00
    - cron: '0 23,2,5,8,11,14 * * *'
  workflow_dispatch: # 支持在 Actions 页面手动触发

# 允许把抓取结果提交回仓库
permissions:
  contents: write

# 避免两次抓取重叠
concurrency:
  group: fetch-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 数据库需要跨次运行保留，否则每次都从零开始建库：
      #   条目 id 会重新分配（前端「已读」按 id 记录，会全部错位）、
      #   增量去重失效、历史条目可能被漏掉。
      #
      # 注意两点：
      #   1) key 必须是固定值。若用 ${{ github.run_id }} 作 key，每次都是新 key，
      #      restore 时永远命不中，数据库等于没有缓存（这是本项目踩过的坑）。
      #   2) SQLite 用 WAL 模式，须连带 -wal / -shm 一起缓存，否则会丢掉最近的事务。
      - name: 恢复历史数据库
        uses: actions/cache/restore@v4
        with:
          path: |
            data/better-news.db
            data/better-news.db-wal
            data/better-news.db-shm
          key: bn-db-v1

      - name: 自动发现学院栏目（首次或栏目失效时执行）
        run: |
          if [ ! -f config/discovered.json ]; then
            echo "未找到 discovered.json，执行栏目发现…"
            npm run discover
          else
            echo "已存在 discovered.json，跳过（如需重新发现请手动运行 npm run discover）"
          fi
        continue-on-error: true

      - name: 抓取通知（校级 + 学院）
        run: npm run fetch:all

      - name: 导出静态数据快照
        run: npm run export

      - name: 自检数据质量
        run: npm run selftest
        continue-on-error: true

      - name: 保存数据库缓存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/better-news.db
            data/better-news.db-wal
            data/better-news.db-shm
          key: bn-db-v1

      - name: 提交更新的快照
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data config/discovered.json
          if git diff --staged --quiet; then
            echo "数据无变化，无需提交"
            exit 0
          fi

          COUNT=$(node -e "console.log(require('./public/data/index.json').total)")
          git commit -m "chore(data): 更新通知快照（共 ${COUNT} 条）[skip ci]"

          # 推送可能被拒：checkout 到 push 之间若有人（或另一次运行）推了新提交，
          # 本地分支就落后了。这里先 rebase 再推；数据文件冲突时以本次抓取结果为准。
          for i in 1 2 3; do
            if git push; then
              echo "已提交并推送，站点会自动重新发布"
              exit 0
            fi
            echo "推送被拒，第 ${i} 次重试：先同步远端…"
            git pull --rebase --autostash -X ours origin main || git rebase --abort || true
            sleep 5
          done
          echo "::error::连续 3 次推送失败，请检查仓库权限或分支保护设置"
          exit 1
